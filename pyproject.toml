[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-stockfish-packet"
version = "1.1.0"
description = "Grounded research packets with claim-citation integrity"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "SMF Works"}]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/smfworks/hermes-plugin-stockfish-packet"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
